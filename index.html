<script>
/* ---------- platform metadata ---------- */
const P={
  bsmc:{n:"BSMC",mhz:50,c:"bsmc"},
  riscv:{n:"RISC-V",mhz:50,c:"riscv"},
  a72:{n:"ARM A72",mhz:1400,c:"a72"},
  ryzen:{n:"Ryzen (1 core)",mhz:5500,c:"ryzen"},
  ryzen16:{n:"Ryzen (16 cores)",mhz:5500,c:"ryzen16"}
};
const ORD=["bsmc","riscv","a72","ryzen","ryzen16"];
const byOrd=rows=>rows.slice().sort((a,b)=>ORD.indexOf(a[0])-ORD.indexOf(b[0]));
// every visit starts in per-clock view with a linear scale
let S="lin";
let M="clk";
let CUR=null; // task shown now; a task may set its own common clock (clk, MHz) and memory (mem)

/* ---------- chart builders ---------- */
function logBars(rows,{unit,fmt}={}){
  const vals=rows.map(r=>r.v).filter(v=>v>0);
  const NA=`<span class="val" style="left:0">no single clock for 16 cores</span>`;
  let lo=Math.floor(Math.log10(Math.min(...vals))), hi=Math.ceil(Math.log10(Math.max(...vals)));
  if(hi===lo)hi++;
  const vmax=Math.max(...vals);
  const pos=S==="lin"?v=>v/vmax*100:v=>(Math.log10(v)-lo)/(hi-lo)*100;
  let ticks="";
  if(S==="lin"){for(let q=0;q<=4;q++)ticks+=`<i class="tick" style="left:${q*25}%"></i>`}
  else{for(let e=lo;e<=hi;e++)ticks+=`<i class="tick" style="left:${pos(10**e)}%"></i>`}
  let h=`<div class="chart bands">`;
  for(const r of rows){
    if(r.v==null){h+=`<div class="row tinted t-${r.c}"><div class="lbl">${r.label}</div><div class="track">${ticks}${NA}</div></div>`;continue}
    const w=Math.max(pos(r.v),0.8), txt=(fmt||nf)(r.v)+(unit?" "+unit:"");
    const inside=w>50;
    h+=`<div class="row tinted t-${r.c}"><div class="lbl">${r.label}</div><div class="track">${ticks}<div class="bar c-${r.c}" style="width:${w}%"></div><span class="val" style="${inside?`right:${100-w}%;color:#fff`:`left:${w}%`}">${txt}</span></div></div>`;
  }
  let sc="";
  if(S==="lin"){sc=`<span style="left:0%">0</span><span style="left:50%;transform:translateX(-50%)">${nf(vmax/2)}</span><span style="left:100%">${nf(vmax)}</span>`}
  else{for(let e=lo;e<=hi;e++)sc+=`<span style="left:${pos(10**e)}%">${nf(10**e,Math.max(0,-e))}</span>`}
  h+=`<div class="axis"><div></div><div class="scale">${sc}</div></div></div>`;
  return h;
}
/* diverging log bars around 1x: >1 BSMC ahead (right, good), <1 behind (left, bad) */
function divBars(rows,{span=3}={}){
  const rr=rows.filter(r=>r.v!=null&&r.v>0).map(r=>Math.max(r.v,1/r.v)),R=Math.max(2,...rr);
  const pos=S==="lin"?v=>50+(v>=1?1:-1)*(Math.max(v,1/v)-1)/(R-1)*50:v=>50+Math.max(-1,Math.min(1,Math.log10(v)/span))*50;
  let ticks="";
  if(S==="lin"){for(let q=0;q<=4;q++)ticks+=`<i class="tick" style="left:${q*25}%"></i>`}
  else{for(let e=-span;e<=span;e++)ticks+=`<i class="tick" style="left:${50+e/span*50}%"></i>`}
  let h=`<div class="chart${rows.some(r=>r.c)?" bands":""}">`;
  for(const r of rows){
    if(r.ref){h+=`<div class="row${r.c?" tinted t-"+r.c:""}"><div class="lbl">${r.label}</div><div class="track">${ticks}<i class="mid"></i><span class="val" style="left:50%">baseline</span></div></div>`;continue}
    if(r.v==null){h+=`<div class="row${r.c?" tinted t-"+r.c:""}"><div class="lbl">${r.label}</div><div class="track">${ticks}<span class="val" style="left:50%">–</span></div></div>`;continue}
    const p=pos(r.v), good=r.v>=1, l=good?50:p, w=Math.max(Math.abs(p-50),0.6);
    const lab=good?(p>78?`<span class="val" style="right:${100-p}%;color:#fff">${xf(r.v)}</span>`:`<span class="val" style="left:${p}%">${xf(r.v)}</span>`):(p<22?`<span class="val" style="left:${p}%;color:#fff">${xf(r.v)}</span>`:`<span class="val" style="right:${100-p}%">${xf(r.v)}</span>`);
    h+=`<div class="row${r.c?" tinted t-"+r.c:""}"><div class="lbl">${r.label}</div><div class="track">${ticks}<i class="mid"></i><div class="bar ${okx(r.v)?"c-good":"c-bad"}" style="left:${l}%;width:${w}%"></div>${lab}</div></div>`;
  }
  let sc="";
  if(S==="lin"){sc=`<span style="left:0%">1/${nf(Math.round(R),0)}</span><span style="left:50%;transform:translateX(-50%)">1x</span><span style="left:100%">${nf(Math.round(R),0)}x</span>`}
  else for(const e of [-2,0,2]){if(Math.abs(e)>span)continue;const v=10**e;sc+=`<span style="left:${50+e/span*50}%;transform:translateX(-50%)">${e===0?"1x":e>0?nf(v)+"x":"1/"+nf(1/v)}</span>`}
  h+=`<div class="axis"><div></div><div class="scale">${sc}</div></div></div>`;
  return h;
}

  <div class="grid3 g4">${[["riscv","RISC-V",0],["a72","ARM A72",1],["ryzen","Ryzen (1 core)",2],["ryzen16","Ryzen (16 cores)",3]].map(([k,n,ci])=>`<div class="panel tinted t-${k}"><h3><i class="sw c-${k}"></i> vs ${n}${hz(k)}</h3>${divBars(SUMY().map(x=>({label:`<a href="#${x[1]}"><b>${x[0]}</b></a>`,v:sumCols(x)[ci]})),{span:3,compact:true})}</div>`).join("")}</div>

  <h2>What it means</h2>
  <ul class="cons">
   <li>Where the work is a chain of dependent random memory reads (Redis, hash, graph), the BSMC is <b>2.2-3.7x faster than an A72 core in absolute terms</b>. Already at 100 MHz with LPDDR4 memory, it <b>takes on a 5.5 GHz Ryzen core with DDR5</b>: 3 vs 4 M GET/s in Redis GET, and <b>70%</b> of it in hash lookup.</li>

    return {rows,val,lb,b};
}

function cpuPage(){
  let ticks="";
  for(let q=0;q<=4;q++)ticks+=`<i class="tick" style="left:${q*25}%"></i>`;

  const KW="var(--bsmc)",KC="var(--good)",KT="color-mix(in srgb,var(--good) 70%,var(--bsmc))";
  let h=`<div class="eyebrow">Cambridge Architecture®</div><h1>The CPU computes, the memory leads</h1>
  <p class="lede">The BSMC implements the <b>Cambridge Architecture®</b>: the CPU is the compute engine, and the memory directs the work. With the BSMC, the CPU gains two things:</p>
  <ul class="cons" style="margin-top:6px">
   <li><b>No waiting for data:</b> the data is there when the CPU needs it. With full integration this is <b>Zero Latency Memory (ZLM)</b>: the BSMC hides the entire memory latency from the CPU.</li>
   <li><b>No data preparation:</b> the CPU no longer has to prepare the next piece of data. Only the task's own computation remains.</li>
  </ul>
  <p>Each bar shows the share of CPU time the BSMC frees up. The speedup is shown under the workload name.</p>
  <div class="legend"><span><i class="sw" style="background:${KW}"></i>data access</span><span><i class="sw" style="background:${KC}"></i>data preparation</span><span><i class="sw" style="background:${KT}"></i>both combined</span></div>`;
  for(const p of CPUX){
    h+=`<div class="h2row"><h2><b>${p.name}</b> <span class="hz">${p.hz}</span> + BSMC ${INFO(p.tip)}</h2></div><div class="panel"><div class="chart bands">`;
    for(const r of p.rows){
      const ww=r[2]==null?0:r[2]*100,wc=r[3]*100,tot=ww+wc,inside=tot>40;
      const bars=r[2]==null?`<div class="bar" style="width:${wc}%;background:${KT}"></div>`:`<div class="bar" style="width:${ww}%;background:${KW};border-radius:3px 0 0 3px"></div><div class="bar" style="left:${ww}%;width:${wc}%;background:${KC};border-radius:0 3px 3px 0"></div>`;
      const split=r[2]==null?"":`<span class="sz"> (${Math.round(ww)}% + ${Math.round(wc)}%)</span>`;
      h+=`<div class="row tinted t-${p.c}"><div class="lbl"><b>${r[0]}</b><br><span class="muted">${r[1]} · <b>${r[5]}</b> faster</span></div><div class="track">${ticks}${bars}<span class="val" style="${inside?`right:${100-tot}%;color:#fff`:`left:${tot}%`}"><b>${r[4]}</b>${split}</span></div></div>`;
    }
    h+=`<div class="axis"><div></div><div class="scale">${sc}</div></div></div>${p.note?`<p class="note" style="margin-top:10px">${p.note}</p>`:""}</div>`;
  }
  return h;
}


function methodPage(){
  const PL=[
   ["bsmc","BSMC","50 / 100 MHz","in this test",["On FPGA, AMD Versal VPK120 board","Three 64 KB Yonder SmartCache™ units (192 KB in total)","Three LPDDR4 memories"]],
   ["riscv","RISC-V","50 MHz","1 core",["On the same FPGA, next to the BSMC","No cache, no floating-point unit"]],
   ["a72","ARM Cortex-A72","1.4 GHz","1 core",["The Versal chip's built-in CPU","Bare metal, caches enabled"]],
   ["ryzen","AMD Ryzen 9 7950X","5.5 GHz","measured: 5.57 / 5.41 GHz (1 / 16 cores)",["16 cores, 64 MB L3 cache, dual-channel DDR5","Ubuntu, gcc -O3 -march=native, stock system settings"]]
  ];
  return `<div class="eyebrow">Methodology</div><h1>How we measured</h1>
  <p class="lede">The tests measure <b>data access</b>, not the compute capacity of the CPUs. The selected workloads are <b>widely used data-handling tasks with almost no computation</b>, the kind that hold back today's computers. Every platform runs the same C code on the same data. Outputs are compared by checksum and are bit-exact across platforms and code levels.</p>
  <h2>Platforms</h2>
  <div class="specs">${PL.map(([k,n,c,cs,li])=>`<div class="spec panel tinted t-${k}"><div class="spec-h"><h3>${n}</h3><div class="spec-c">${c}<small>${cs}</small></div></div><ul>${li.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
  <h2>Code levels</h2>
  <p>The BSMC is compared against <b>the fastest code on each CPU</b>: whichever of the three levels gave the best result on that platform. The charts show under each platform name which code ran. The BSMC runs the BSMC version of the task.</p>
  <dl class="defs">
   <dt>Naive</dt><dd>The core of the task in simple, portable C, without platform-specific optimization.</dd>
   <dt>Optimized</dt><dd>The naive code tuned for the platform: SIMD (Ryzen AVX2/VNNI, A72 NEON), software prefetching, multithreading.</dd>
   <dt>Standard</dt><dd>The relevant function of a widely used package, extracted unmodified (OpenCV, FBGEMM, Redis, GAP, TensorFlow Lite Micro, stream.c). Output is bit-exact with the original package.</dd>
   <dt>BSMC</dt><dd>The same task: the BSMC handles data access, the CPU does the computation. On the test board that CPU is the RISC-V. Since the tests measure data access, rows marked “gather” show BSMC data access; the full task (data access and computation together) is listed separately.</dd>
  </dl>
  <h2>Measurement rules</h2>
  <dl class="defs">
   <dt>Repetition</dt><dd>Every value is the best of three runs.</dd>
   <dt>Cache</dt><dd>Every run gets a fresh, random request stream. Caches accelerate repeated access, but in workloads on large datasets data is rarely reused. The measurement reflects this real-world situation.</dd>
   <dt>Verification</dt><dd>Every output is checked against the reference by checksum.</dd>
  </dl>
  <h2>Views</h2>
  <dl class="defs">
   <dt>Absolute</dt><dd>Measured throughput per second, each platform at its own clock.</dd>
   <dt>Per clock <span class="tag">[C]</span></dt><dd>All platforms at 5.5 GHz: measured throughput scaled linearly with clock, capped at the measured limit of the Ryzen's DDR5 memory (684 M cache lines/s random, 54-70 GB/s sequential). On the Remap page the common clock is 1.4 GHz and the cap is the board's LPDDR4 memory.</dd>
   <dt>No memory cap <span class="tag">[C]</span></dt><dd>The same without a memory cap, e.g. with HBM: only the number of requests counts. The Ryzen (16 cores) value is then 16 times the single-core value.</dd>
  </dl>
  <h2>Notation</h2>
  <dl class="defs">
   <dt><span class="tag">[M]</span></dt><dd>Measured value (the default when unmarked).</dd>
   <dt><span class="tag">[C]</span></dt><dd>Calculated from measured values.</dd>
   <dt><span class="tag">[E]</span></dt><dd>Estimate.</dd>
  </dl>`;
}

const RACE={
 redis:{n:"Redis GET",u:"GET",cap:171,rows:[["bsmc",3.0,100],["ryzen",3.95],["ryzen16",49.4],["a72",1.20],["riscv",0.019]]},

function raceRates(){const R=RACE[race.t];const at=(k,v,m)=>v*GHZ/(m||P[k].mhz);const r1=(R.rows.find(r=>r[0]==="ryzen")||[0,0])[1];return byOrd(R.rows).map(([k,v,m])=>[k,k==="bsmc"?v*YK():v,m]).map(([k,v,m])=>({k,m,v:race.m==="real"?v:race.m==="ideal"?(k==="ryzen16"?16*at("ryzen",r1):at(k,v,m)):Math.min(at(k,v,m),Math.max(R.cap,v))}))}
function raceCaption(){

function raceStart(){
  const cv=document.getElementById("race");if(!cv)return;
  const ctx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const w=cv.clientWidth||600,dpr=devicePixelRatio||1,h=Math.round(Math.max(210,Math.min(260,w*0.34)));cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);race.W=w;race.H=h}
  size();addEventListener("resize",size);
  race.m=M==="abs"?"real":M;race.dots=[];race.acc={};race.cnt={};
  cancelAnimationFrame(race.raf);race.last=performance.now();
  function frame(now){
    if(!document.getElementById("race"))return;
    const dt=Math.min(0.05,(now-race.last)/1000);race.last=now;
    const rs=raceRates(),max=Math.max(...rs.map(r=>r.v));
    const W=race.W,H=race.H,labW=Math.min(150,W*0.3),laneH=(H-10)/rs.length,x0=labW+8,x1=W-8;
    ctx.clearRect(0,0,W,H);
    rs.forEach((r,i)=>{
      const y=5+laneH*i+laneH/2, rate=r.v/max*46; // dots per second shown
      ctx.fillStyle="#15232b";ctx.fillRect(x0,y-laneH*0.32,x1-x0,laneH*0.64);
      if(!reduce){race.acc[r.k]=(race.acc[r.k]||0)+rate*dt;while(race.acc[r.k]>=1){race.acc[r.k]-=1;race.dots.push({k:r.k,i,x:x0,j:(Math.random()-.5)*laneH*0.4})}}
      ctx.fillStyle=HC[r.k];ctx.font="600 13px 'IBM Plex Sans Condensed',sans-serif";ctx.textBaseline="middle";
      ctx.fillText(P[r.k].n,4,y-8);
      ctx.fillStyle="#8fa2ad";ctx.font="500 12px 'IBM Plex Mono',monospace";
      ctx.fillText(nf(r.v)+" M/s"+(race.m!=="real"?"":r.m?` · ${r.m} MHz`:r.k==="bsmc"||r.k==="riscv"?" · 50 MHz":r.k==="a72"?" · 1.4 GHz":" · 5.5 GHz"),4,y+9);
      if(reduce){const w=Math.max(2,(x1-x0)*Math.log10(1+r.v/max*999)/3);ctx.fillStyle=HC[r.k];ctx.fillRect(x0,y-laneH*0.2,w,laneH*0.4)}
    });
    if(!reduce){
      const sp=(x1-x0)/1.6;
      race.dots=race.dots.filter(d=>{d.x+=sp*dt;if(d.x>x1){race.cnt[d.k]=(race.cnt[d.k]||0)+1;return false}const y=5+laneH*d.i+laneH/2+d.j;ctx.fillStyle=HC[d.k];ctx.beginPath();ctx.arc(d.x,y,3.2,0,6.283);ctx.fill();return true});
    }
    race.raf=requestAnimationFrame(frame);
  }
  race.raf=requestAnimationFrame(frame);
  document.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{race.t=b.dataset.rt;race.dots=[];race.acc={};document.querySelectorAll("[data-rt]").forEach(x=>x.setAttribute("aria-pressed",x===b));raceCaption()});
  raceCaption();
  // prefill so the first frame is not empty
  if(!reduce){const rs=raceRates(),max=Math.max(...rs.map(r=>r.v));rs.forEach((r,i)=>{const n=Math.round(r.v/max*46*1.6);for(let j=0;j<n;j++)race.dots.push({k:r.k,i,x:0,j:0,pre:j/n})})}
  race.dots.forEach(d=>{if(d.pre!=null){const W=race.W,labW=Math.min(150,W*0.3),x0=labW+8,x1=W-8,laneH=(race.H-10)/raceRates().length;d.x=x0+(x1-x0)*d.pre;d.j=(Math.random()-.5)*laneH*0.4;delete d.pre}});
}

const BRRE=/\b(AMD Ryzen|Ryzen|RISC-V|Cortex-A72|A72|ARM)(?![A-Za-z0-9])/g;
function colorBrands(root){
  if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest("svg,script,style,nav,button,.br,.val,.scale"))return NodeFilter.FILTER_REJECT;BRRE.lastIndex=0;return BRRE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){
    const f=document.createDocumentFragment();
    let last=0;
    const t=n.nodeValue;
    BRRE.lastIndex=0;
    for(const m of t.matchAll(BRRE)){
      if(m.index>last)f.appendChild(document.createTextNode(t.slice(last,m.index)));
      const sp=document.createElement("span");
      const k=/Ryzen/.test(m[1])?"ryzen":m[1]==="RISC-V"?"riscv":"a72";
      sp.className="br br-"+k;
      sp.textContent=m[1];
      f.appendChild(sp);
      last=m.index+m[1].length;
    }
    if(last<t.length)f.appendChild(document.createTextNode(t.slice(last)));
    n.replaceWith(f);
  }
}
